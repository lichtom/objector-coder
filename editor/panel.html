<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>舞台</title>
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --bg-primary: #1e1e1e; --bg-secondary: #252526; --bg-surface: #2d2d2d;
      --text-primary: #cccccc; --text-secondary: #969696; --text-muted: #6a6a6a;
      --border: #3c3c3c; --accent: #007acc; --accent-hover: #1c97ea;
      --green: #4ec9b0; --red: #f44747;
    }
    html, body { width:100%; height:100%; overflow:hidden; font-family:'Segoe UI','Microsoft YaHei',sans-serif; background:var(--bg-primary); color:var(--text-primary); }
    body { display:flex; flex-direction:column; }
    .titlebar { position:relative; display:flex; align-items:center; justify-content:space-between; height:28px; padding:0 6px 0 10px; background:var(--bg-surface); border-bottom:1px solid var(--border); -webkit-app-region:drag; user-select:none; flex-shrink:0; z-index:100; }
    .titlebar-title { font-size:11px; font-weight:600; color:var(--text-secondary); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; }
    .titlebar-title .pname { color:var(--accent); }
    .titlebar-controls { display:flex; gap:1px; -webkit-app-region:no-drag; flex-shrink:0; }
    .titlebar-btn { width:22px; height:20px; border:none; background:transparent; color:var(--text-muted); cursor:pointer; font-size:11px; display:flex; align-items:center; justify-content:center; border-radius:2px; }
    .titlebar-btn:hover { background:var(--bg-secondary); color:var(--text-primary); }
    .titlebar-btn.pinned { color:var(--accent); }
    .titlebar-btn.pinned .tb-icon { transform: rotate(45deg); }
    .titlebar-btn .tb-icon { transition: transform 0.2s ease; }
    .titlebar-btn.win-close:hover { background:#e81123; color:#fff; }
    .tb-btn { padding:4px 10px; background:var(--bg-surface); border:1px solid var(--border); color:var(--text-primary); border-radius:3px; cursor:pointer; font-size:11px; }
    .tb-btn:hover { background:var(--bg-hover,#2a2d2e); border-color:var(--accent); }
    .tb-icon { height:14px; width:auto; vertical-align:middle; margin-right:4px; flex-shrink:0; }
    .titlebar-btn .tb-icon { height:12px; margin-right:0; }

    /* Stage */
    #stage-area { flex:2; display:flex; align-items:center; justify-content:center; background:#11111b; min-height:100px; overflow:hidden; }
    #stage-canvas { background:#fff; border-radius:2px; }

    /* Divider */
    #panel-divider { height:4px; background:var(--border); cursor:row-resize; flex-shrink:0; }
    #panel-divider:hover { background:var(--accent); }

    /* Output */
    #output-area { flex:1; display:flex; flex-direction:column; min-height:60px; overflow:hidden; }
    #output-toolbar { display:flex; align-items:center; gap:4px; padding:2px 6px; border-bottom:1px solid var(--border); background:var(--bg-surface); flex-shrink:0; }
    #output-toolbar span { font-size:11px; color:var(--text-secondary); }
    #output-log { flex:1; overflow-y:auto; padding:8px; font-family:'Cascadia Code','Consolas',monospace; font-size:12px; color:var(--text-secondary); white-space:pre-wrap; user-select:text; -webkit-user-select:text; }
  </style>
</head>
<body>
  <div class="titlebar">
    <span class="titlebar-title"><span class="pname" id="pname">未命名项目</span> - 舞台</span>
    <div class="titlebar-controls">
      <button class="titlebar-btn" id="btn-pin" title="置顶"><img src="../icons/窗口操作图标/固定.svg" class="tb-icon"></button>
      <button class="titlebar-btn" id="btn-minimize" title="最小化"><img src="../icons/窗口操作图标/最小化.svg" class="tb-icon"></button>
      <button class="titlebar-btn" id="btn-maximize" title="最大化"><img src="../icons/窗口操作图标/最大化.svg" class="tb-icon"></button>
      <button class="titlebar-btn win-close" id="btn-close" title="关闭"><img src="../icons/窗口操作图标/关闭.svg" class="tb-icon"></button>
    </div>
  </div>

  <!-- Stage area -->
  <div id="stage-area">
    <canvas id="stage-canvas" width="480" height="360"></canvas>
  </div>

  <!-- Divider -->
  <div id="panel-divider"></div>

  <!-- Output area -->
  <div id="output-area">
    <div id="output-toolbar">
      <span><img src="../icons/Document.svg" class="tb-icon" style="height:11px;"> 输出</span>
      <button class="tb-btn" id="btn-clear-output" style="margin-left:auto;padding:2px 8px;font-size:10px;">清除</button>
    </div>
    <div id="output-log"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="panel.js"></script>
</body>
</html>
