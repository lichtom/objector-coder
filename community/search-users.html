<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>查找用户 - Objector 社区</title>
  <link rel="icon" href="../icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="shared/community.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="shared/community-api.js"></script>
  <script src="shared/community-ui.js"></script>
</head>
<body>
  <div id="nav"></div>

  <div class="page-container">
    <div class="page-header">
      <h1>🔍 查找用户</h1>
      <p>搜索社区中的其他创作者</p>
    </div>

    <!-- 搜索框 -->
    <div style="max-width:480px;margin:0 auto 32px;">
      <div style="position:relative;">
        <input type="text" id="search-input" placeholder="输入用户名..." autofocus
          style="width:100%;padding:12px 44px 12px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:15px;outline:none;transition:border-color .2s;"
        />
        <button id="btn-clear" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;display:none;" title="清空">✕</button>
      </div>
      <div id="search-hint" style="text-align:center;margin-top:8px;color:var(--muted);font-size:13px;"></div>
    </div>

    <!-- 搜索结果 -->
    <div id="results-container">
      <div style="text-align:center;color:var(--muted);padding:40px 0;">输入用户名开始搜索</div>
    </div>

    <!-- 最近加入的用户（初始显示） -->
    <div id="recent-section">
      <h2 style="font-size:16px;color:var(--text2);margin-bottom:16px;">最近加入</h2>
      <div id="recent-users" class="card-list"></div>
    </div>
  </div>

  <footer class="footer">
    <p>Objector Community · Powered by Supabase</p>
  </footer>

  <script>
    CommunityAPI.init();
    CommunityUI.renderNav('nav');
    CommunityAPI.restoreSession().then(() => CommunityUI.renderNav('nav'));

    const input = document.getElementById('search-input');
    const btnClear = document.getElementById('btn-clear');
    const hint = document.getElementById('search-hint');
    const resultsContainer = document.getElementById('results-container');
    const recentSection = document.getElementById('recent-section');

    let debounceTimer;

    // 加载最近加入的用户
    async function loadRecent() {
      const res = await CommunityAPI.getRecentProfiles(20);
      const el = document.getElementById('recent-users');
      if (res.data && res.data.length > 0) {
        CommunityUI.fillCards(el, res.data.map(u => CommunityUI.renderUserCard(u)));
      } else {
        el.innerHTML = '<div class="empty-state"><p>暂无用户</p></div>';
      }
    }
    loadRecent();

    // 搜索逻辑
    function doSearch(keyword) {
      clearTimeout(debounceTimer);
      const kw = (keyword || '').trim();

      if (!kw) {
        resultsContainer.innerHTML = '<div style="text-align:center;color:var(--muted);padding:40px 0;">输入用户名开始搜索</div>';
        recentSection.style.display = '';
        btnClear.style.display = 'none';
        hint.textContent = '';
        return;
      }

      btnClear.style.display = '';
      hint.textContent = '搜索中...';
      recentSection.style.display = 'none';

      debounceTimer = setTimeout(async () => {
        const res = await CommunityAPI.searchProfiles(kw);
        if (res.error) {
          resultsContainer.innerHTML = '<div class="empty-state"><p>搜索出错，请稍后重试</p></div>';
          hint.textContent = '';
          return;
        }
        const users = res.data || [];
        hint.textContent = users.length + ' 个结果';
        if (users.length === 0) {
          resultsContainer.innerHTML = '<div class="empty-state"><div class="empty-icon">🔍</div><div class="empty-text">没有找到匹配的用户</div></div>';
          return;
        }
        resultsContainer.innerHTML = '<div class="card-list" id="search-results-list"></div>';
        CommunityUI.fillCards(document.getElementById('search-results-list'), users.map(u => CommunityUI.renderUserCard(u)));
      }, 350);
    }

    input.addEventListener('input', () => doSearch(input.value));

    btnClear.addEventListener('click', () => {
      input.value = '';
      doSearch('');
      input.focus();
    });

    // 从 URL 读取初始搜索词
    const urlKw = new URLSearchParams(location.search).get('q');
    if (urlKw) {
      input.value = urlKw;
      doSearch(urlKw);
    }
  </script>
</body>
</html>
