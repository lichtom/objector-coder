<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>作品详情 - Objector 社区</title>
  <link rel="icon" href="../icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="shared/community.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="shared/community-api.js"></script>
  <script src="shared/community-ui.js"></script>
</head>
<body>
  <div id="nav"></div>

  <div class="page-container">
    <div id="project-detail" class="detail-layout">
      <div class="loading">加载中...</div>
    </div>

    <!-- 评论区 -->
    <section class="comments-section" id="comments-section" style="display:none">
      <h3>💬 评论</h3>
      <div id="comment-form-wrap"></div>
      <div id="comments-list" class="comment-list"></div>
    </section>
  </div>

  <footer class="footer">
    <p>Objector Community · Powered by Supabase</p>
  </footer>

  <script>
    CommunityAPI.init();
    CommunityUI.renderNav('nav');
    CommunityAPI.restoreSession().then(() => CommunityUI.renderNav('nav'));

    const projectId = new URLSearchParams(location.search).get('id');
    let projectData = null;

    async function loadProject() {
      if (!projectId) {
        document.getElementById('project-detail').innerHTML = '<div class="empty-state"><p>作品不存在</p><a href="projects.html" class="btn">返回作品广场</a></div>';
        return;
      }

      const res = await CommunityAPI.getProjectById(projectId);
      if (res.error || !res.data) {
        document.getElementById('project-detail').innerHTML = '<div class="empty-state"><p>作品不存在或已被删除</p><a href="projects.html" class="btn">返回作品广场</a></div>';
        return;
      }

      projectData = res.data;
      renderProject(projectData);
      loadComments();
    }

    function renderProject(p) {
      const user = CommunityAPI.getUser();
      const isAuthor = user && p.author_id === user.id;
      const authorName = p.profiles ? p.profiles.username : '匿名';
      const authorInitial = (authorName || '?')[0].toUpperCase();
      const authorAvatar = p.profiles && p.profiles.avatar_url ? p.profiles.avatar_url : CommunityUI.makeAvatarSvgUrl(authorInitial, 40);
      const thumb = p.thumbnail_url || CommunityUI.makeThumbPlaceholder('⚡');

      document.getElementById('project-detail').innerHTML = `
        <div class="detail-main">
          <div class="detail-preview">
            <img src="${thumb}" alt="${p.title}" class="preview-img" id="preview-img" onerror="CommunityUI.onThumbError(this,'⚡')" />
            ${(p.json_data || p.zip_url) ? '<button class="btn btn-outline btn-sm" id="btn-preview">▶ 在线预览</button>' : ''}
            ${isAuthor ? `
              <button class="btn btn-outline btn-sm" id="btn-change-thumb" style="margin-top:8px;">📷 修改封面</button>
              <input type="file" id="thumb-input" accept="image/*" style="display:none" />
            ` : ''}
          </div>
          <div class="detail-info">
            <h1>${p.title}</h1>
            <div class="detail-meta">
              <a href="profile.html?id=${p.author_id}" class="user-link">
                <img src="${authorAvatar}" class="avatar-sm" onerror="CommunityUI.onImgError(this,'${authorInitial}')" />
                ${authorName}
              </a>
              <span>·</span>
              <span>${new Date(p.created_at).toLocaleDateString()}</span>
            </div>
            ${p.description ? `<div class="detail-desc">${CommunityUI.parseMarkdown(p.description)}</div>` : ''}
            <div class="detail-stats">
              <span>❤️ ${p.likes_count || 0} 点赞</span>
              <span>⬇️ ${p.downloads_count || 0} 下载</span>
            </div>
            <div class="detail-actions">
              ${user ? `<button class="btn btn-outline" id="btn-like">${p.user_liked ? '❤️ 已点赞' : '🤍 点赞'}</button>` : ''}
              ${p.zip_url ? `<a href="${p.zip_url}" class="btn btn-primary" download>⬇️ 下载作品</a>` : ''}
              ${isAuthor ? `<button class="btn btn-danger btn-sm" id="btn-delete">删除</button>` : ''}
            </div>
          </div>
        </div>
      `;

      // 绑定修改封面
      if (isAuthor) {
        const btnChangeThumb = document.getElementById('btn-change-thumb');
        const thumbInput = document.getElementById('thumb-input');
        if (btnChangeThumb && thumbInput) {
          btnChangeThumb.addEventListener('click', () => thumbInput.click());
          thumbInput.addEventListener('change', handleThumbChange);
        }
      }

      // 绑定事件
      const btnLike = document.getElementById('btn-like');
      if (btnLike) {
        btnLike.addEventListener('click', async () => {
          const liked = btnLike.textContent.includes('已点赞');
          const result = liked
            ? await CommunityAPI.unlikeTarget('project', projectId)
            : await CommunityAPI.likeTarget('project', projectId);
          if (!result.error) location.reload();
        });
      }

      const btnPreview = document.getElementById('btn-preview');
      if (btnPreview) {
        btnPreview.addEventListener('click', () => {
          window.open('../editor/editor.html?preview=' + encodeURIComponent(projectId), '_blank');
        });
      }

      const btnDelete = document.getElementById('btn-delete');
      if (btnDelete) {
        btnDelete.addEventListener('click', async () => {
          if (!confirm('确定要删除这个作品吗？')) return;
          const result = await CommunityAPI.deleteProject(projectId);
          if (result.error) {
            CommunityUI.showToast('删除失败', 'error');
          } else {
            CommunityUI.showToast('已删除', 'success');
            setTimeout(() => location.href = 'projects.html', 1000);
          }
        });
      }

      // 显示评论区
      document.getElementById('comments-section').style.display = '';
    }

    // 封面修改处理
    function handleThumbChange(e) {
      const file = e.target.files[0];
      if (!file) return;

      if (!file.type.startsWith('image/')) {
        CommunityUI.showToast('请选择图片文件', 'error');
        return;
      }
      if (file.size > 5 * 1024 * 1024) {
        CommunityUI.showToast('封面图片不能超过 5MB', 'error');
        return;
      }

      const reader = new FileReader();
      reader.onload = (ev) => {
        showThumbPreview(ev.target.result, file);
      };
      reader.readAsDataURL(file);
    }

    function showThumbPreview(dataUrl, file) {
      const modal = document.createElement('div');
      modal.className = 'modal-overlay';
      modal.id = 'thumb-modal';
      modal.innerHTML = `
        <div class="modal-content thumb-modal">
          <h3>修改封面</h3>
          <div class="thumb-preview-wrap">
            <img src="${dataUrl}" class="thumb-preview-img" alt="封面预览" />
          </div>
          <p style="color:var(--muted,#6c7086);font-size:13px;margin:12px 0;">确认使用这张图片作为作品封面吗？</p>
          <div class="modal-actions">
            <button class="btn btn-outline btn-sm" id="thumb-cancel">取消</button>
            <button class="btn btn-primary btn-sm" id="thumb-confirm">确认上传</button>
          </div>
        </div>
      `;
      document.body.appendChild(modal);

      document.getElementById('thumb-cancel').addEventListener('click', () => {
        modal.remove();
        const input = document.getElementById('thumb-input');
        if (input) input.value = '';
      });

      document.getElementById('thumb-confirm').addEventListener('click', async () => {
        const btn = document.getElementById('thumb-confirm');
        btn.disabled = true;
        btn.textContent = '上传中...';
        const res = await CommunityAPI.updateProject(projectId, {}, null, file);
        if (res.error) {
          CommunityUI.showToast('上传失败: ' + res.error, 'error');
          btn.disabled = false;
          btn.textContent = '确认上传';
        } else {
          CommunityUI.showToast('封面已更新', 'success');
          modal.remove();
          loadProject();
        }
      });

      modal.addEventListener('click', (e) => {
        if (e.target === modal) {
          modal.remove();
          const input = document.getElementById('thumb-input');
          if (input) input.value = '';
        }
      });
    }

    async function loadComments() {
      const res = await CommunityAPI.getComments('project', projectId);
      const list = document.getElementById('comments-list');
      const formWrap = document.getElementById('comment-form-wrap');

      // 渲染评论表单
      const user = CommunityAPI.getUser();
      if (user) {
        formWrap.innerHTML = CommunityUI.renderCommentForm('project', projectId, loadComments);
        CommunityUI.bindCommentForm('project', projectId, '#comment-form-wrap', loadComments);
      } else {
        formWrap.innerHTML = '<div class="comment-form-locked"><a href="login.html">登录</a>后才能评论</div>';
      }

      // 渲染评论列表
      if (res.data && res.data.length > 0) {
        list.innerHTML = CommunityUI.renderCommentList(res.data);
      } else {
        list.innerHTML = '<div class="empty-hint">暂无评论</div>';
      }
    }

    loadProject();
  </script>
</body>
</html>
