<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>作品广场 - Objector 社区</title>
  <link rel="icon" href="../icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="shared/community.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="shared/community-api.js"></script>
  <script src="shared/community-ui.js"></script>
</head>
<body>
  <div id="nav"></div>

  <div class="page-container">
    <div class="page-header">
      <h1>🎨 作品广场</h1>
      <a href="../editor/index.html" class="btn btn-primary" id="btn-publish" style="display:none">发布作品</a>
    </div>

    <!-- 筛选栏 -->
    <div class="filter-bar">
      <div class="filter-tabs">
        <button class="filter-tab active" data-sort="new">最新</button>
        <button class="filter-tab" data-sort="hot">最热</button>
        <button class="filter-tab" data-sort="downloads">最多下载</button>
      </div>
      <div class="search-box">
        <input type="text" id="search-input" placeholder="搜索作品..." />
      </div>
    </div>

    <!-- 作品网格 -->
    <div id="projects-grid" class="card-grid"></div>

    <!-- 分页 -->
    <div id="pagination" class="pagination"></div>
  </div>

  <footer class="footer">
    <p>Objector Community · Powered by Supabase</p>
  </footer>

  <script>
    CommunityAPI.init();
    CommunityUI.renderNav('nav');
    CommunityAPI.restoreSession().then(() => CommunityUI.renderNav('nav'));

    let currentPage = 1;
    let currentSort = 'new';
    let searchQuery = '';

    // 登录用户才显示发布按钮
    if (CommunityAPI.getUser()) {
      document.getElementById('btn-publish').style.display = '';
    }

    // 筛选切换
    document.querySelectorAll('.filter-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentSort = tab.dataset.sort;
        currentPage = 1;
        loadProjects();
      });
    });

    // 搜索
    let searchTimer = null;
    document.getElementById('search-input').addEventListener('input', (e) => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => {
        searchQuery = e.target.value.trim();
        currentPage = 1;
        loadProjects();
      }, 400);
    });

    async function loadProjects() {
      const grid = document.getElementById('projects-grid');
      grid.innerHTML = '<div class="loading">加载中...</div>';

      const res = await CommunityAPI.getProjects(currentPage, currentSort, searchQuery);
      if (res.error) {
        grid.innerHTML = '<div class="empty-state"><p>加载失败，请刷新重试</p></div>';
        return;
      }

      if (!res.data || res.data.length === 0) {
        grid.innerHTML = '<div class="empty-state"><p>暂无作品</p></div>';
        return;
      }

      grid.innerHTML = res.data.map(p => CommunityUI.renderProjectCard(p)).join('');
      bindDeleteButtons();
      CommunityUI.renderPagination('pagination', currentPage, res.total || res.data.length, (page) => {
        currentPage = page;
        loadProjects();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    }

    // 绑定删除按钮点击事件
    function bindDeleteButtons() {
      document.querySelectorAll('.card-delete-btn').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          e.preventDefault();
          e.stopPropagation();
          const projectId = btn.dataset.projectId;
          if (!confirm('确定要删除这个作品吗？此操作不可撤销。')) return;
          const result = await CommunityAPI.deleteProject(projectId);
          if (result.error) {
            CommunityUI.showToast('删除失败', 'error');
          } else {
            CommunityUI.showToast('已删除', 'success');
            btn.closest('.card').remove();
          }
        });
      });
    }

    loadProjects();
  </script>
</body>
</html>
